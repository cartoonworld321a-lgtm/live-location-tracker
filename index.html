<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Live Bus Tracker</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    #startButton {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 1000;
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      background: #1976d2;
      color: white;
      font-size: 16px;
    }

    #status {
      position: absolute;
      top: 65px;
      left: 15px;
      z-index: 1000;
      background: white;
      padding: 10px 15px;
      border-radius: 8px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }
  </style>
</head>

<body>

  <button id="startButton">Start Live Location</button>

  <div id="status">Waiting for GPS...</div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

    import {
      getDatabase,
      ref,
      set,
      onValue
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";


    // =========================
    // FIREBASE
    // =========================

    const firebaseConfig = {
      apiKey: "AIzaSyD4eQ0qzXy5tBCJzQngG_agwDWrSghL13o",
      authDomain: "live-location-tracker-6cef6.firebaseapp.com",
      databaseURL: "https://live-location-tracker-6cef6-default-rtdb.firebaseio.com",
      projectId: "live-location-tracker-6cef6",
      storageBucket: "live-location-tracker-6cef6.firebasestorage.app",
      messagingSenderId: "707093277933",
      appId: "1:707093277933:web:0d9464477b21a4554bb0e4",
      measurementId: "G-0122LFYS3Q"
    };

    const app = initializeApp(firebaseConfig);

    const db = getDatabase(app);


    // =========================
    // MAP
    // =========================

    const map = L.map("map").setView(
      [32.9857, 70.6027],
      13
    );

    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        attribution: "&copy; OpenStreetMap contributors"
      }
    ).addTo(map);


    // =========================
    // BUS MARKER
    // =========================

    let busMarker = null;


    // =========================
    // READ BUS LOCATION
    // =========================

    const locationRef = ref(db, "user1");

    onValue(locationRef, (snapshot) => {

      const data = snapshot.val();

      if (!data) {
        document.getElementById("status").textContent =
          "🔴 No bus location";
        return;
      }

      const latitude = Number(data.latitude);
      const longitude = Number(data.longitude);

      if (
        !Number.isFinite(latitude) ||
        !Number.isFinite(longitude)
      ) {
        return;
      }

      const position = [
        latitude,
        longitude
      ];


      // Create marker
      if (!busMarker) {

        busMarker = L.marker(position)
          .addTo(map)
          .bindPopup("🚌 Bus 1");

        map.setView(position, 16);

      } else {

        // Move marker
        busMarker.setLatLng(position);

      }

      document.getElementById("status").textContent =
        "🟢 Bus Live";

    });


    // =========================
    // SEND PHONE GPS TO FIREBASE
    // =========================

    document
      .getElementById("startButton")
      .addEventListener("click", () => {

        if (!navigator.geolocation) {

          alert(
            "GPS is not supported on this phone."
          );

          return;
        }


        document.getElementById("status").textContent =
          "📡 Getting GPS...";


        navigator.geolocation.watchPosition(

          async (position) => {

            const latitude =
              position.coords.latitude;

            const longitude =
              position.coords.longitude;

            const speed =
              position.coords.speed || 0;


            // Save GPS to Firebase
            await set(
              ref(db, "user1"),
              {
                latitude: latitude,
                longitude: longitude,
                speed: speed,
                timestamp: Date.now()
              }
            );


            // Show own location immediately
            const myPosition = [
              latitude,
              longitude
            ];


            if (!busMarker) {

              busMarker = L.marker(myPosition)
                .addTo(map)
                .bindPopup("🚌 Bus 1");

            } else {

              busMarker.setLatLng(
                myPosition
              );

            }


            map.setView(
              myPosition,
              16
            );


            document.getElementById("status").textContent =
              "🟢 GPS + Firebase Live";

          },


          (error) => {

            document.getElementById("status").textContent =
              "🔴 GPS Error";

            alert(
              "GPS Error: " + error.message
            );

          },


          {
            enableHighAccuracy: true,
            maximumAge: 3000,
            timeout: 10000
          }

        );

      });

  </script>

</body>
</html>
