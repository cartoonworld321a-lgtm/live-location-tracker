<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Location Tracker</title>
</head>

<body>
  <h1>📍 Live Location Tracker</h1>

  <button id="startBtn">Start Location</button>

  <p id="status">Location not started</p>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import {
      getDatabase,
      ref,
      set
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

    // Firebase config yahan baad mein add karenge
    const firebaseConfig = {
      // Firebase Console se config yahan paste hoga
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    document.getElementById("startBtn").addEventListener("click", () => {

      if (!navigator.geolocation) {
        document.getElementById("status").textContent =
          "Geolocation supported nahi hai.";
        return;
      }

      navigator.geolocation.watchPosition(
        (position) => {

          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;

          document.getElementById("status").textContent =
            `Latitude: ${latitude}, Longitude: ${longitude}`;

          set(ref(db, "locations/user1"), {
            latitude: latitude,
            longitude: longitude,
            timestamp: Date.now()
          });

        },
        (error) => {
          document.getElementById("status").textContent =
            "Location permission/error: " + error.message;
        }
      );

    });
  </script>

</body>
</html>
