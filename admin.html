<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bus Tracking - Admin Panel</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f8;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .bus {
      border: 1px solid #ddd;
      padding: 15px;
      margin-top: 12px;
      border-radius: 10px;
      background: #fafafa;
    }

    .bus h3 {
      margin-top: 0;
    }

    .status {
      font-weight: bold;
    }

    .offline {
      color: #dc2626;
    }

    .success {
      background: #dcfce7;
      color: #166534;
      padding: 10px;
      margin-top: 15px;
      border-radius: 8px;
      display: none;
    }

    .empty {
      color: #666;
      text-align: center;
    }
  </style>
</head>

<body>

<header>
  <h1>🚌 Bus Tracking Admin</h1>
</header>

<div class="container">

  <!-- ADD BUS -->

  <div class="card">

    <h2>➕ Add New Bus</h2>

    <input
      type="text"
      id="busId"
      placeholder="Bus ID e.g. BUS001"
    >

    <input
      type="text"
      id="busName"
      placeholder="Bus Name"
    >

    <input
      type="text"
      id="driverName"
      placeholder="Driver Name"
    >

    <input
      type="text"
      id="route"
      placeholder="Route e.g. Bannu - Peshawar"
    >

    <button id="addButton">
      ➕ Add Bus
    </button>

    <div id="message" class="success"></div>

  </div>


  <!-- BUS LIST -->

  <div class="card">

    <h2>🚌 All Buses</h2>

    <div id="busList">
      <p class="empty">Loading buses...</p>
    </div>

  </div>

</div>


<script type="module">

  // =========================
  // FIREBASE IMPORTS
  // =========================

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

  import {
    getDatabase,
    ref,
    set,
    onValue
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";


  // =========================
  // FIREBASE CONFIG
  // =========================

  const firebaseConfig = {

    apiKey: "AIzaSyD4eQ0qzXy5tBCJzQngG_agwDWrSghL13o",

    authDomain:
      "live-location-tracker-6cef6.firebaseapp.com",

    databaseURL:
      "https://live-location-tracker-6cef6-default-rtdb.firebaseio.com",

    projectId:
      "live-location-tracker-6cef6",

    storageBucket:
      "live-location-tracker-6cef6.firebasestorage.app",

    messagingSenderId:
      "707093277933",

    appId:
      "1:707093277933:web:0d9464477b21a4554bb0e4",

    measurementId:
      "G-0122LFYS3Q"
  };


  // =========================
  // START FIREBASE
  // =========================

  const app = initializeApp(firebaseConfig);

  const db = getDatabase(app);


  // =========================
  // ADD BUS
  // =========================

  document
    .getElementById("addButton")
    .addEventListener("click", async () => {

      const busId =
        document.getElementById("busId").value.trim();

      const busName =
        document.getElementById("busName").value.trim();

      const driverName =
        document.getElementById("driverName").value.trim();

      const route =
        document.getElementById("route").value.trim();

      const message =
        document.getElementById("message");


      if (
        !busId ||
        !busName ||
        !driverName ||
        !route
      ) {

        message.style.display = "block";

        message.textContent =
          "❌ Please fill all fields.";

        return;
      }


      try {

        await set(
          ref(db, "buses/" + busId),
          {
            busId: busId,
            busName: busName,
            driverName: driverName,
            route: route,
            status: "offline",
            createdAt: Date.now()
          }
        );


        message.style.display = "block";

        message.textContent =
          "✅ Bus added successfully!";


        document.getElementById("busId").value = "";

        document.getElementById("busName").value = "";

        document.getElementById("driverName").value = "";

        document.getElementById("route").value = "";

      }

      catch (error) {

        message.style.display = "block";

        message.textContent =
          "❌ Firebase Error: " + error.message;

      }

    });


  // =========================
  // LOAD ALL BUSES
  // =========================

  const busesRef = ref(db, "buses");

  onValue(busesRef, (snapshot) => {

    const data = snapshot.val();

    const busList =
      document.getElementById("busList");


    busList.innerHTML = "";


    if (!data) {

      busList.innerHTML =
        '<p class="empty">No buses added yet.</p>';

      return;
    }


    Object.values(data).forEach((bus) => {

      const busDiv =
        document.createElement("div");

      busDiv.className = "bus";


      busDiv.innerHTML = `

        <h3>🚌 ${bus.busName || "Unnamed Bus"}</h3>

        <p>
          <strong>Bus ID:</strong>
          ${bus.busId || "-"}
        </p>

        <p>
          <strong>Driver:</strong>
          ${bus.driverName || "-"}
        </p>

        <p>
          <strong>Route:</strong>
          ${bus.route || "-"}
        </p>

        <p class="status offline">
          🔴 ${bus.status || "offline"}
        </p>

      `;


      busList.appendChild(busDiv);

    });

  });

</script>

</body>
</html>
